name: tests
on:
  push:
    branches: [master]
  pull_request:
jobs:
  unit:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e .
      - name: Run core shard tests
        run: python -m unittest tests_shard.py -v
      - name: Run CLI and packaging tests
        run: python -m unittest tests_cli_pkg.py -v
      - name: Run training ecosystem tests
        run: python -m unittest tests_training_ecosystem.py -v
      - name: Run network persistence and security tests
        run: python -m unittest tests_network_persistence_security.py -v
      - name: Run shard network tests
        run: python -m unittest tests_shard_network.py -v
      - name: Run Phase 4 network integration tests
        run: python -m unittest tests_phase4_network_integration.py -v
      - name: Run Phase III unified hosting tests
        run: python -m unittest tests_phase_iii_unified_hosting.py -v
      - name: Run full test suite discovery
        run: python -m unittest discover -s . -p "tests_*.py" -v
