name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  test-before-publish:
    name: Run test suite before publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .
      - name: Run test suite
        run: python -m unittest discover -s test -t . -p "tests_*.py" -v
  build-and-publish:
    name: Build distributions and publish to PyPI
    needs: test-before-publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/shard-engine
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install build tools
      run: python -m pip install --upgrade pip build twine
    - name: Build distributions
      run: python -m build
    - name: Validate distribution integrity
      run: python -m twine check dist/*
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
