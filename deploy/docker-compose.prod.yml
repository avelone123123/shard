version: "3.8"
services:
  shard-discovery:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.discovery
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - SHARD_ALLOW_INSECURE_LOCAL=0
    volumes:
      - discovery_data:/data/discovery
    networks:
      - shard_internal
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
  shard-relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.relay
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - SHARD_ALLOW_INSECURE_LOCAL=0
    networks:
      - shard_internal
    expose:
      - "8081"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
