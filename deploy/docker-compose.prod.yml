version: "3.8"
services:
  shard-discovery:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.discovery
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - SHARD_ALLOW_INSECURE_LOCAL=0
    volumes:
      - discovery_data:/data/discovery
    networks:
      - shard_internal
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
  shard-relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.relay
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - SHARD_ALLOW_INSECURE_LOCAL=0
    networks:
      - shard_internal
    expose:
      - "8081"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ACME_EMAIL=${ACME_EMAIL:-admin@shard.network}
      - DISCOVERY_DOMAIN=${DISCOVERY_DOMAIN:-discovery.shard.network}
      - RELAY_DOMAIN=${RELAY_DOMAIN:-relay.shard.network}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - shard_internal
    depends_on:
      - shard-discovery
      - shard-relay
volumes:
  discovery_data:
  caddy_data:
  caddy_config:
networks:
  shard_internal:
    driver: bridge