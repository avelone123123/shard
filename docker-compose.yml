services:
  shard-engine:
    build: .
    container_name: shard-engine
    ports:
      - "8000:8000"
    environment:
      - SHARD_MODELS_DIR=/data/models
      - SHARD_DATA_DIR=/data/shard
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - shard_models:/data/models
      - shard_data:/data/shard
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
volumes:
  shard_models:
    name: shard_models_volume
  shard_data:
    name: shard_data_volume