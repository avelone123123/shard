[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "shard-engine"
dynamic = ["version"]
description = "Distributed local LLM inference engine with OpenAI/Anthropic API, GGUF/llama.cpp, and LAN memory pooling"
readme = "README.md"
authors = [{name = "avelone123123", email = "avelone.dev@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["llm", "inference", "local-ai", "gguf", "llama-cpp", "distributed-inference", "openai-api", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0,<43.0; python_version < '3.9'",
    "cryptography>=42.0; python_version >= '3.9'",
    "websockets>=12.0",
]
[project.optional-dependencies]
ml = [
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "tqdm>=4.65.0",
]
full = [
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "tqdm>=4.65.0",
]
training = [
    "soup-cli[train]>=0.72.0; python_version >= '3.11' and python_version < '3.14'",
]
dev = [
    "build>=1.0.0",
    "twine>=5.0.0",
    "pytest>=7.0.0",
]
[project.scripts]
shard = "shard_engine.cli:main"
[project.urls]
Homepage = "https://avelone123123.github.io/shard/"
Repository = "https://github.com/avelone123123/shard"
Issues = "https://github.com/avelone123123/shard/issues"
[tool.setuptools]
include-package-data = true
[tool.setuptools.dynamic]
version = {attr = "shard_engine.__version__"}
[tool.setuptools.packages.find]
where = ["."]
include = ["shard_engine*"]
exclude = ["tests*", "website*", "assets*", "docs*", "native*"]
[tool.setuptools.package-data]
shard_engine = ["dashboard.html", "engine_optimizations.json"]
