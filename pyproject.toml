[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "shard-engine"
version = "1.4.36"
description = "Tri-language local neural engine (Python + C++20 + MASM AVX2 Assembly)"
readme = "README.md"
authors = [{name = "avelone123123", email = "avelone.dev@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "requests>=2.28.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0"
]
[project.scripts]
shard = "cli:main"
[project.urls]
Homepage = "https://github.com/avelone123123/shard"
Repository = "https://github.com/avelone123123/shard.git"
